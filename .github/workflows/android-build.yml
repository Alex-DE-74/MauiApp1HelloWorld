name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Wechsel auf das unterstützte .NET 10 SDK

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore Dependencies
      # Zwingt den Server, die Pakete für das aktuelle .NET 10 zu laden
      run: dotnet restore /p:TargetFramework=net10.0-android

    - name: Build and Publish APK
      # Kompiliert die App direkt als zukunftssichere .NET 10 Android App
      run: |
        dotnet publish -c Release -f net10.0-android /p:TargetFramework=net10.0-android /p:AndroidPackageFormat=apk /p:AndroidUnsignedApk=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          **/bin/Release/*-android/publish/*.apk
