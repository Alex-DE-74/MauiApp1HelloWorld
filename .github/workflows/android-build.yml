name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore Dependencies
      # Ignoriert den Support-Ablauf von .NET 8 beim Laden der Pakete
      run: dotnet restore /p:CheckEolTargetFramework=false

    - name: Build and Publish APK
      # Ignoriert den Support-Ablauf von .NET 8 beim Kompilieren der APK
      run: |
        dotnet publish -c Release -f net8.0-android /p:AndroidPackageFormat=apk /p:AndroidUnsignedApk=true /p:CheckEolTargetFramework=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          **/bin/Release/*-android/publish/*.apk
