name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Wechsel auf das stabile .NET 8 SDK

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore Dependencies
      # Errechnet die Abhängigkeiten direkt für .NET 8
      run: dotnet restore /p:TargetFramework=net8.0-android

    - name: Build and Publish APK
      # Zwingt den Compiler, das Projekt als net8.0-android zu bauen
      run: |
        dotnet publish -c Release -f net8.0-android /p:TargetFramework=net8.0-android /p:AndroidPackageFormat=apk /p:AndroidUnsignedApk=true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          **/bin/Release/*-android/publish/*.apk
